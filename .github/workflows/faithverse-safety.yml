name: FaithVerse safe build
on:
  pull_request:
    paths:
      - 'app/faithverse/**'
      - 'scripts/media/**'
      - 'scripts/recovery/**'
      - '.github/workflows/faithverse-safety.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --check scripts/media/compress.mjs
      - run: node --check scripts/recovery/snapshot.mjs
      - name: Generate source manifest snapshot
        run: node scripts/recovery/snapshot.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: faithverse-source-manifest
          path: recovery-manifest.json
          retention-days: 30
